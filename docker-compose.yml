# ═══════════════════════════════════════════════════════════════
# CHIMERA — Docker Compose (Production)
# ═══════════════════════════════════════════════════════════════
# Usage:
#   cp .env.production .env
#   docker compose up -d --build
#   docker compose logs -f chimera
#
# Services (6):
#   chimera    — Next.js 16 standalone (port 3000)
#   caddy      — Reverse proxy + auto-SSL (ports 80/443)
#   obscura    — Headless browser Rust/V8 (CDP port 9222)
#   colibri    — GLM-5.2 744B MoE inference (port 8000) [optional]
#   ollama     — Local LLM inference (port 11434) [optional]
#   codegeex   — CodeGeeX4 native OpenAI-compat API (port 8001) [optional]
#
# ═══════════════════════════════════════════════════════════════

services:
  # ── CHIMERA App (Next.js 16 Standalone) ──────────────────
  chimera:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chimera-app
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - chimera-data:/app/data           # SQLite DB + Obscura snapshots
      - chimera-db:/app/db                # Prisma migrations
      - obscura-bin:/usr/local/bin/obscura # Shared Obscura binary
    depends_on:
      obscura:
        condition: service_started
        required: false
      colibri:
        condition: service_healthy
        required: false
      ollama:
        condition: service_started
        required: false
      codegeex:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/colibri/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    networks:
      - chimera-net

  # ── Caddy (Reverse Proxy + Auto-SSL) ─────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: chimera-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "${CADDY_ADMIN_PORT:-2019}:2019"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      chimera:
        condition: service_healthy
    networks:
      - chimera-net

  # ── Obscura (Headless Browser — Rust/V8/CDP) ────────────
  # Optional: set ENABLE_OBSCURA=true in .env to activate
  obscura:
    image: alpine:3.20
    container_name: chimera-obscura
    restart: unless-stopped
    profiles:
      - obscura
    entrypoint: ["sh", "-c", "echo 'Obscura: mount binary to /usr/local/bin/obscura/ and override entrypoint' && sleep infinity"]
    ports:
      - "${OBSCURA_CDP_PORT:-9222}:9222"  # CDP WebSocket
      - "${OBSCURA_SERVE_PORT:-9223}:9223" # Serve mode (Puppeteer)
    volumes:
      - obscura-bin:/usr/local/bin/obscura:ro
    environment:
      - OBSCURA_HEADLESS=true
      - OBSCURA_STEALTH=true
      - OBSCURA_CDP_HOST=0.0.0.0
      - OBSCURA_CDP_PORT=9222
    networks:
      - chimera-net

  # ── Colibri (GLM-5.2 MoE Inference Engine) ────────────────
  # Optional: set ENABLE_COLIBRI=true in .env to activate
  # Requires GPU (NVIDIA) — uncomment gpu deployment below
  colibri:
    image: alpine:3.20
    container_name: chimera-colibri
    restart: unless-stopped
    profiles:
      - colibri
    entrypoint: ["sh", "-c", "echo 'Colibri: build and mount custom Colibri binary' && sleep infinity"]
    ports:
      - "${COLIBRI_PORT:-8000}:8000"
    environment:
      - COLIBRI_MODEL=glm-5.2-744b-moe
      - COLIBRI_HOST=0.0.0.0
      - COLIBRI_PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/v1/models || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    networks:
      - chimera-net

  # ── Ollama (Local LLM Inference) ────────────────────────
  # Optional: set ENABLE_OLLAMA=true in .env to activate
  # Pull models: docker compose exec ollama ollama pull llama3
  ollama:
    image: ollama/ollama:latest
    container_name: chimera-ollama
    restart: unless-stopped
    profiles:
      - ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - chimera-net

  # ── CodeGeeX4 Native (OpenAI-Compatible API) ────────────────
  # Optional: set ENABLE_CODEGEEX=true in .env to activate
  # Exposes /v1/chat/completions with streaming + function calling
  # Based on: github.com/zai-org/CodeGeeX4 (local_mode/protocols/openai_api.py)
  # Requires: GPU + CodeGeeX4 model weights mounted at /models
  codegeex:
    build:
      context: ./codegeex4
      dockerfile: Dockerfile
    container_name: chimera-codegeex
    restart: unless-stopped
    profiles:
      - codegeex
    ports:
      - "${CODEGEEX_PORT:-8001}:8000"
    volumes:
      - codegeex-models:/models
      - codegeex-cache:/root/.cache
    environment:
      - CODEGEEX_HOST=0.0.0.0
      - CODEGEEX_PORT=8000
      - CODEGEEX_MODEL=${CODEGEEX_MODEL:-codegeex4}
      - CODEGEEX_MAX_TOKENS=${CODEGEEX_MAX_TOKENS:-4096}
      - CODEGEEX_TEMPERATURE=${CODEGEEX_TEMPERATURE:-0.2}
    deploy:
      resources:
        limits:
          memory: 32G
          cpus: '4.0'
        reservations:
          memory: 16G
          cpus: '2.0'
    # Uncomment the entire deploy block below for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/models')"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    networks:
      - chimera-net

volumes:
  chimera-data:
    driver: local
  chimera-db:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  obscura-bin:
    driver: local
  ollama-data:
    driver: local
  codegeex-models:
    driver: local
  codegeex-cache:
    driver: local

networks:
  chimera-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
